apiVersion: v1
kind: Service
metadata:
  name: {{ include "dmlf.fullname" . }}-manager
  labels:
    {{- include "dmlf.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dmlf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: manager
  ports:
    - name: grpc
      port: {{ .Values.service.ports.grpc.port }}
      targetPort: {{ .Values.service.ports.grpc.targetPort }}
      protocol: TCP
    - name: http-health
      port: {{ .Values.service.ports.httpHealth.port }}
      targetPort: {{ .Values.service.ports.httpHealth.targetPort }}
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.ports.metrics.port }}
      targetPort: {{ .Values.service.ports.metrics.targetPort }}
      protocol: TCP