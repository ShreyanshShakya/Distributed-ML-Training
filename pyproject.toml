[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmlf"
version = "0.4.0"
description = "Distributed Machine Learning Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "psutil>=5.9.0",
    "tensorboard>=2.13.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "rich",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "prometheus-client>=0.19",
]

[project.entry-points."dmlf.scheduler.plugins"]
builtin = "dmlf.manager.schedulers.builtin:PriorityBinPackScheduler"